# ===================================================================
# Taskora Spring Boot Configuration
# ===================================================================
spring.application.name=taskora-backend

# Server Port
server.port=8080

# MySQL 8 Database Configuration
# Uses environment variables with sensible local defaults for development
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/taskora?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# JSON Formatting
spring.jackson.date-format=yyyy-MM-dd'T'HH:mm:ss
spring.jackson.time-zone=UTC
